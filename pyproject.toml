[project]
name = "pdf-to-epub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kudzik", email = "kudzik@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling[easyocr]>=2.146.0",
    "rapidocr-onnxruntime>=1.4.4",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
pdf-to-epub = "pdf_to_epub:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*force_full_page_ocr.*:DeprecationWarning",
    "ignore:.*generate_table_images.*:DeprecationWarning",
    "ignore:.*This field is deprecated.*:DeprecationWarning",
]
